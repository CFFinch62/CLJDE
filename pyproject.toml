[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cljde"
version = "0.1.0"
description = "CLJDE — a Clojure IDE in Python + PyQt6"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Chuck Finch", email = "chuck@fragillidae.invalid" }]
keywords = ["clojure", "ide", "nrepl", "pyqt6"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Editors",
]
dependencies = [
    "PyQt6==6.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cljde = "cljde.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cljde*"]

[tool.setuptools.package-data]
cljde = ["resources/themes/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:PyQt6.*",
]
