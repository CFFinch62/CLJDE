<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="CLJDE — A Clojure IDE">
  <title>CLJDE — A Clojure IDE</title>
  <desc>CLJDE wordmark banner using the official Clojure palette on a dark background.</desc>

  <rect width="1200" height="300" fill="#0D1117"/>

  <text x="600" y="180"
        font-family="ui-monospace, 'SF Mono', 'Menlo', 'Consolas', 'Liberation Mono', monospace"
        font-size="156"
        font-weight="700"
        letter-spacing="-3"
        text-anchor="middle">
    <tspan fill="#91DC47">(</tspan><tspan fill="#90B4FE">clj</tspan><tspan fill="#63B132">de</tspan><tspan fill="#5881D8">)</tspan>
  </text>

  <text x="600" y="238"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
        font-size="22"
        font-weight="400"
        letter-spacing="4"
        fill="#8B949E"
        text-anchor="middle">A CLOJURE IDE</text>
</svg>
